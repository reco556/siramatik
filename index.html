<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Profesyonel Sıramatik ve Çift Hat Barko Ekranı</title>
  <!-- Excel kütüphanesi -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sol Taraf: Çift Barko / TV Ekranı (%65) */
    .display-side {
      flex: 6.5;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-right: 2px solid #334155;
      height: 100vh;
      overflow: hidden;
    }

    .display-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      height: 50%;
      overflow: hidden;
    }

    /* Sağ Taraf: Personel / Kontrol Paneli (%35) */
    .control-side {
      flex: 3.5;
      background: #1e293b;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100vh;
      overflow: hidden;
    }

    .control-top {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .control-bottom {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      overflow: hidden;
      gap: 5px;
    }

    /* Yalnızca TV Penceresi Modu */
    body.tv-mode .control-side {
      display: none !important;
    }
    body.tv-mode .display-side {
      flex: 100% !important;
      border-right: none !important;
      padding: 12px !important;
      gap: 10px !important;
    }

    h1 { color: #38bdf8; margin-bottom: 2px; font-size: 1rem; flex-shrink: 0; }
    body.tv-mode h1 { font-size: 1.2rem; }

    .queue-container {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 4px;
      flex-grow: 1;
      justify-content: flex-start;
      overflow-y: auto;
    }

    .queue-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 4px 10px;
      border-radius: 4px;
      border-left: 4px solid #64748b;
      min-height: 28px;
      flex-shrink: 0;
    }

    .queue-card.active {
      background: #0284c7;
      border-left-color: #4ade80;
    }

    .rank { font-size: 0.85rem; font-weight: bold; width: 22px; opacity: 0.8; color: #38bdf8; }
    .name-area { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; font-weight: 700; flex-grow: 1; }
    .flag { font-size: 1rem; }
    .status { font-size: 0.75rem; background: rgba(255,255,255,0.15); padding: 1px 6px; border-radius: 3px; white-space: nowrap; }

    /* Kontrol Paneli Elemanları */
    input, select, button {
      width: 100%;
      padding: 6px 8px;
      font-size: 0.8rem;
      border-radius: 5px;
      border: none;
      outline: none;
    }

    input, select {
      background: #0f172a;
      color: #fff;
      border: 1px solid #475569;
    }

    button {
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #16a34a; }

    .btn-call { background: #3b82f6; margin-top: 3px; flex-shrink: 0; }
    .btn-call:hover { background: #2563eb; }
    
    .btn-tv { background: #8b5cf6; font-size: 0.75rem; }
    .btn-tv:hover { background: #7c3aed; }

    .btn-title { background: #0284c7; font-size: 0.7rem; padding: 3px; margin-top: 2px; }
    .btn-title:hover { background: #0369a1; }

    .btn-clear-all { background: #ef4444; font-size: 0.7rem; padding: 3px 6px; }
    .btn-clear-all:hover { background: #dc2626; }

    .btn-delete { background: #ef4444; padding: 2px 4px; font-size: 0.6rem; width: auto; }
    .btn-edit { background: #f59e0b; padding: 2px 4px; font-size: 0.6rem; width: auto; color: white; }
    .btn-edit:hover { background: #d97706; }
    
    .excel-box {
      border: 1px dashed #475569;
      padding: 5px;
      text-align: center;
      border-radius: 5px;
      background: #0f172a;
    }

    .waiting-list-small {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
      flex-grow: 1;
      background: #0f172a;
      padding: 5px;
      border-radius: 5px;
      border: 1px solid #334155;
    }

    .mini-card {
      background: #1e293b;
      padding: 4px 6px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .mini-left {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow: hidden;
    }
    .action-btns {
      display: flex;
      gap: 2px;
    }
  </style>
</head>
<body>

  <!-- SOL TARAF: ÇİFT MÜSABAKA/HAT TV EKRANI -->
  <div class="display-side">
    <div class="display-section">
      <h1 id="screenTitle1Text">1. MÜSABAKA / HAT EKRANI</h1>
      <div class="queue-container" id="queueList1"></div>
    </div>

    <div class="display-section">
      <h1 id="screenTitle2Text">2. MÜSABAKA / HAT EKRANI</h1>
      <div class="queue-container" id="queueList2"></div>
    </div>
  </div>

  <!-- SAĞ TARAF: PERSONEL / KONTROL PANELİ -->
  <div class="control-side">
    <div class="control-top">
      <h2 style="color:#38bdf8; font-size:1rem;">Personel Paneli</h2>

      <button class="btn-tv" type="button" onclick="openTVWindow()">📺 TV Ekranını Ayrı Pencerede Aç</button>
      
      <div style="background: #0f172a; padding: 5px; border-radius: 5px; border: 1px solid #334155;">
        <label style="font-size: 0.65rem; color: #cbd5e1; display: block; margin-bottom: 1px;">🏷️ 1. Ekran Başlığı:</label>
        <input type="text" id="customTitle1Input" placeholder="1. Hat Başlığı">
        <label style="font-size: 0.65rem; color: #cbd5e1; display: block; margin-top: 2px; margin-bottom: 1px;">🏷️ 2. Ekran Başlığı:</label>
        <input type="text" id="customTitle2Input" placeholder="2. Hat Başlığı">
        <button class="btn-title" type="button" onclick="updateTitles()">Başlıkları Güncelle</button>
      </div>

      <div class="excel-box">
        <label style="font-size: 0.7rem; color: #cbd5e1; display: block; margin-bottom: 1px;">📊 Excel'den Toplu Liste Yükle</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" onchange="readExcelFile(this)">
      </div>

      <input type="hidden" id="editId" value="">

      <div>
        <label style="font-size:0.75rem;">Kişi / Ad Soyad:</label>
        <input type="text" id="personName" placeholder="Örn: Ahmet Yılmaz">
      </div>

      <div style="display: flex; gap: 4px;">
        <div style="flex: 1;">
          <label style="font-size:0.75rem;">Ülke:</label>
          <select id="countrySelect">
            <option value="TR">🇹🇷 TR</option>
            <option value="US">🇺🇸 US</option>
            <option value="GB">🇬🇧 GB</option>
            <option value="DE">🇩🇪 DE</option>
            <option value="FR">🇫🇷 FR</option>
            <option value="AZ">🇦🇿 AZ</option>
            <option value="NL">🇳🇱 NL</option>
            <option value="IT">🇮🇹 IT</option>
          </select>
        </div>
        <div style="flex: 1;">
          <label style="font-size:0.75rem;">Müsabaka/Hat:</label>
          <select id="matchSelect">
            <option value="1">1. Hat</option>
            <option value="2">2. Hat</option>
          </select>
        </div>
      </div>
      
      <div>
        <label style="font-size:0.75rem;">Banko/Oda:</label>
        <input type="text" id="counterName" value="Banko 1">
      </div>

      <div style="display: flex; gap: 4px;">
        <button id="saveBtn" type="button" onclick="savePerson()" style="flex: 2;">Listeye Ekle</button>
        <button id="cancelEditBtn" type="button" onclick="cancelEdit()" style="background: #64748b; display: none; flex: 1;">İptal</button>
      </div>
    </div>

    <!-- Kontrol Alt Kısım -->
    <div class="control-bottom">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2px;">
        <h2 style="font-size: 0.9rem; margin: 0; color:#38bdf8;">Sıradakiler (<span id="totalCount">0</span>)</h2>
        <button class="btn-clear-all" type="button" onclick="clearAllList()">🗑️ Tümünü Sil</button>
      </div>
      <div class="waiting-list-small" id="miniList"></div>
    </div>

    <button class="btn-call" type="button" onclick="callSelected()">Seçilenleri Çağır 🔔</button>
  </div>

  <audio id="dingSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isTVMode = urlParams.get('tv') === 'true';

    if (isTVMode) {
      document.body.classList.add('tv-mode');
    }

    let queue = [];
    try {
      const saved = localStorage.getItem('siramatik_queue_dual');
      if (saved) queue = JSON.parse(saved);
    } catch(e) {
      queue = [];
    }

    const dingSound = document.getElementById('dingSound');

    function normalizeCountryCode(val) {
      if (!val) return 'TR';
      const clean = String(val).trim().toUpperCase();
      
      const map = {
        'TURKEY': 'TR', 'TÜRKIYE': 'TR', 'TURKIYE': 'TR', 'TUR': 'TR',
        'USA': 'US', 'AMERICA': 'US', 'UNITED STATES': 'US',
        'GERMANY': 'DE', 'ALMANYA': 'DE', 'DEU': 'DE',
        'FRANCE': 'FR', 'FRANSA': 'FR', 'FRA': 'FR',
        'ENGLAND': 'GB', 'UK': 'GB', 'INGILTERE': 'GB', 'İNGİLTERE': 'GB',
        'AZERBAIJAN': 'AZ', 'AZERBAYCAN': 'AZ', 'AZE': 'AZ',
        'NETHERLANDS': 'NL', 'HOLLANDA': 'NL', 'NED': 'NL',
        'ITALY': 'IT', 'ITALYA': 'IT', 'İTALYA': 'IT', 'ITA': 'IT'
      };

      if (clean.length === 2) return clean;
      return map[clean] || 'TR';
    }

    function getFlagEmoji(countryCode) {
      const code = normalizeCountryCode(countryCode);
      return code.replace(/./g, char => 
        String.fromCodePoint(127397 + char.charCodeAt(0))
      );
    }

    function renderTitles() {
      const title1 = localStorage.getItem('siramatik_title_1') || '1. MÜSABAKA / HAT EKRANI';
      const title2 = localStorage.getItem('siramatik_title_2') || '2. MÜSABAKA / HAT EKRANI';
      
      const t1Elem = document.getElementById('screenTitle1Text');
      const t2Elem = document.getElementById('screenTitle2Text');
      if (t1Elem) t1Elem.textContent = title1;
      if (t2Elem) t2Elem.textContent = title2;

      const i1 = document.getElementById('customTitle1Input');
      const i2 = document.getElementById('customTitle2Input');
      if (i1 && document.activeElement !== i1) i1.value = title1;
      if (i2 && document.activeElement !== i2) i2.value = title2;
    }

    function saveData(triggerSound = false) {
      try {
        localStorage.setItem('siramatik_queue_dual', JSON.stringify(queue));
        if (triggerSound) {
          localStorage.setItem('siramatik_play_sound_dual', Date.now().toString());
        }
      } catch(e) {}
      renderUI();
    }

    function openTVWindow() {
      const baseUrl = window.location.href.split('?')[0];
      window.open
