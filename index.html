<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Profesyonel Sıramatik ve Barko Ekranı</title>
  <!-- Excel kütüphanesi -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" onerror="console.warn('Excel kütüphanesi yüklenemedi.')"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sol Taraf: Barko / TV Ekranı (%65) */
    .display-side {
      flex: 6.5;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      border-right: 2px solid #334155;
    }

    /* Sağ Taraf: Personel / Kontrol Paneli (%35) */
    .control-side {
      flex: 3.5;
      background: #1e293b;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
    }

    /* Yalnızca TV Penceresi Modu */
    body.tv-mode .control-side {
      display: none !important;
    }
    body.tv-mode .display-side {
      flex: 100% !important;
      border-right: none !important;
      padding: 50px !important;
    }

    h1, h2 { color: #38bdf8; margin-bottom: 5px; }

    .queue-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }

    .queue-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 20px 25px;
      border-radius: 12px;
      border-left: 8px solid #64748b;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .queue-card.active {
      background: #0284c7;
      border-left-color: #4ade80;
      transform: scale(1.02);
    }

    .rank { font-size: 1.8rem; font-weight: bold; width: 50px; opacity: 0.8; color: #38bdf8; }
    .name-area { display: flex; align-items: center; gap: 15px; font-size: 2.2rem; font-weight: 700; flex-grow: 1; }
    .flag { font-size: 2.5rem; }
    .status { font-size: 1.5rem; background: rgba(255,255,255,0.15); padding: 5px 15px; border-radius: 8px; }

    /* Kontrol Paneli Elemanları */
    input, select, button {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    input, select {
      background: #0f172a;
      color: #fff;
      border: 1px solid #475569;
    }

    button {
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #16a34a; }

    .btn-call { background: #3b82f6; margin-top: 5px; }
    .btn-call:hover { background: #2563eb; }
    
    .btn-tv { background: #8b5cf6; font-size: 0.9rem; }
    .btn-tv:hover { background: #7c3aed; }

    .btn-title { background: #0284c7; font-size: 0.85rem; padding: 6px; margin-top: 5px; }
    .btn-title:hover { background: #0369a1; }

    .btn-delete { background: #ef4444; padding: 5px 8px; font-size: 0.75rem; width: auto; }
    .btn-edit { background: #f59e0b; padding: 5px 8px; font-size: 0.75rem; width: auto; color: white; }
    .btn-edit:hover { background: #d97706; }
    
    .excel-box {
      border: 2px dashed #475569;
      padding: 15px;
      text-align: center;
      border-radius: 8px;
      background: #0f172a;
    }

    .waiting-list-small {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }
    .mini-card {
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mini-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }
    .action-btns {
      display: flex;
      gap: 4px;
    }
  </style>
</head>
<body>

  <!-- BARKO / TV EKRANI (SOL) -->
  <div class="display-side">
    <h1 id="screenTitleText">ÇAĞRILANLAR EKRANI</h1>
    <div class="queue-container" id="queueList">
      <!-- Çağrılanlar buraya gelecek -->
    </div>
  </div>

  <!-- PERSONEL / KONTROL PANELİ (SAĞ) -->
  <div class="control-side">
    <h2>Personel Paneli</h2>

    <!-- TV Ekranını Ayrı Pencerede Aç Butonu -->
    <button class="btn-tv" type="button" id="btnOpenTV">📺 TV Ekranını Ayrı Pencerede Aç</button>
    
    <!-- Başlık Değiştirme Alanı -->
    <div style="background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155;">
      <label style="font-size: 0.85rem; color: #cbd5e1; display: block; margin-bottom: 4px;">🏷️ Ekran Başlığını Değiştir:</label>
      <input type="text" id="customTitleInput" placeholder="Örn: BEKLEME LİSTESİ / MÜSABAKA SIRASI">
      <button class="btn-title" type="button" id="btnUpdateTitle">Başlığı Güncelle</button>
    </div>

    <!-- Excel Yükleme Alanı -->
    <div class="excel-box">
      <label style="font-size: 0.9rem; color: #cbd5e1; display: block; margin-bottom: 5px;">📊 Excel'den Toplu Liste Yükle</label>
      <input type="file" id="excelFile" accept=".xlsx, .xls, .csv">
      <small style="font-size: 0.75rem; opacity: 0.7;">(Sütunlar: İsim, Ülke Kodu örn: TR, US)</small>
    </div>

    <!-- Gizli Düzenleme ID Alanı -->
    <input type="hidden" id="editId" value="">

    <div>
      <label>Kişi / Ad Soyad:</label>
      <input type="text" id="personName" placeholder="Örn: Ahmet Yılmaz">
    </div>

    <div>
      <label>Ülke Seçin:</label>
      <select id="countrySelect">
        <option value="TR">🇹🇷 Türkiye (TR)</option>
        <option value="US">🇺🇸 Amerika (US)</option>
        <option value="GB">🇬🇧 İngiltere (GB)</option>
        <option value="DE">🇩🇪 Almanya (DE)</option>
        <option value="FR">🇫🇷 Fransa (FR)</option>
        <option value="AZ">🇦🇿 Azerbaycan (AZ)</option>
        <option value="NL">🇳🇱 Hollanda (NL)</option>
        <option value="IT">🇮🇹 İtalya (IT)</option>
      </select>
    </div>
    
    <div>
      <label>Atanacak Banko/Oda:</label>
      <input type="text" id="counterName" value="Banko 1">
    </div>

    <button id="saveBtn" type="button">Listeye Ekle</button>
    <button id="cancelEditBtn" type="button" style="background: #64748b; display: none; margin-top: 5px;">Düzenlemeyi İptal Et</button>

    <hr style="border-color: #334155;">

    <h2>Sıradakiler (<span id="totalCount">0</span>)</h2>
    <div class="waiting-list-small" id="miniList"></div>

    <button class="btn-call" type="button" id="btnCallSelected">Seçilenleri Çağır 🔔</button>
  </div>

  <!-- Ses Efekti -->
  <audio id="dingSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isTVMode = urlParams.get('tv') === 'true';

    if (isTVMode) {
      document.body.classList.add('tv-mode');
    }

    let queue = [];
    try {
      const saved = localStorage.getItem('siramatik_queue');
      if (saved) queue = JSON.parse(saved);
    } catch(e) {
      queue = [];
    }

    const dingSound = document.getElementById('dingSound');

    function getFlagEmoji(countryCode) {
      if (!countryCode) return '🏳️';
      const code = String(countryCode).toUpperCase();
      return code.replace(/./g, char => 
        String.fromCodePoint(127397 + char.charCodeAt(0))
      );
    }

    function renderTitle() {
      const savedTitle = localStorage.getItem('siramatik_title') || 'ÇAĞRILANLAR EKRANI';
      const titleElem = document.getElementById('screenTitleText');
      if (titleElem) titleElem.textContent = savedTitle;
    }

    function saveData(triggerSound = false) {
      try {
        localStorage.setItem('siramatik_queue', JSON.stringify(queue));
        if (triggerSound) {
          localStorage.setItem('siramatik_play_sound', Date.now().toString());
        }
      } catch(e) {}
      renderUI();
    }

    function renderUI() {
      const queueListElement = document.getElementById('queueList');
      const miniListElement = document.getElementById('miniList');
      const totalCount = document.getElementById('totalCount');
      
      if (!queueListElement) return;

      queueListElement.innerHTML = '';
      if (miniListElement) miniListElement.innerHTML = '';
      if (totalCount) totalCount.textContent = queue.length;

      // Sol Ekran (Çağrılanlar)
      const calledList = queue.filter(item => item.status === 'Çağrıldı');
      calledList.sort((a, b) => (a.calledAt || 0) - (b.calledAt || 0));

      if (calledList.length === 0) {
        queueListElement.innerHTML = "<p style='font-size: 1.3rem; opacity: 0.6;'>Şu an çağrılan kimse yok.</p>";
      } else {
        const top6Called = calledList.slice(0, 6);
        top6Called.forEach((item, index) => {
          const card = document.createElement('div');
          card.className = `queue-card ${index === 0 ? 'active' : ''}`;
          const flag = getFlagEmoji(item.ulke);
          card.innerHTML = `
            <div class="rank">${index + 1}.</div>
            <div class="name-area">
              <span class="flag">${flag}</span>
              <span>${item.isim}</span>
            </div>
            <div class="status">${item.banko} (Çağrıldı)</div>
          `;
          queueListElement.appendChild(card);
        });
      }

      // Sağ Liste (Sıradakiler)
      if (miniListElement) {
        if (queue.length === 0) {
          miniListElement.innerHTML = "<p style='font-size: 0.9rem; opacity: 0.6; text-align:center;'>Liste boş.</p>";
        } else {
          queue.forEach((item) => {
            const mini = document.createElement('div');
            mini.className = 'mini-card';
            const flag = getFlagEmoji(item.ulke);
            const isCalled = item.status === 'Çağrıldı';

            mini.innerHTML = `
              <div class="mini-left">
                <input type="checkbox" class="mini-checkbox" data-id="${item.id}" style="width: 18px; height: 18px; cursor: pointer;" ${isCalled ? 'checked' : ''}>
                <span style="font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; ${isCalled ? 'color: #4ade80; font-weight: bold;' : ''}">
                  ${flag} ${item.isim}
                </span>
              </div>
              <div class="action-btns">
                <button class="btn-edit" type="button" data-edit-id="${item.id}">Düzenle</button>
                <button class="btn-delete" type="button" data-delete-id="${item.id}">Sil</button>
              </div>
            `;
            miniListElement.appendChild(mini);
          });
        }
      }
    }

    // Olay Dinleyicileri (Event Listeners)
    document.addEventListener('DOMContentLoaded', () => {
      renderTitle();
      renderUI();

      // Başlık Güncelleme
      document.getElementById('btnUpdateTitle').addEventListener('click', () => {
        const input = document.getElementById('customTitleInput');
        const val = input.value.trim();
        if (!val) return alert("Lütfen bir başlık girin!");
        localStorage.setItem('siramatik_title', val);
        renderTitle();
      });

      // TV Ekranı Açma
      document.getElementById('btnOpenTV').addEventListener('click', () => {
        const baseUrl = window.location.href.split('?')[0];
        window.open(baseUrl + '?tv=true', '_blank', 'width=1280,height=720,scrollbars=yes,resizable=yes');
      });

      // İsim Ekleme / Güncelleme
      document.getElementById('saveBtn').addEventListener('click', () => {
        const editId = document.getElementById('editId').value;
        const nameInput = document.getElementById('personName');
        const countrySelect = document.getElementById('countrySelect');
        const counterInput = document.getElementById('counterName');
        
        const val = nameInput.value.trim();
        if (!val) return alert("Lütfen bir isim girin!");

        if (editId) {
          const index = queue.findIndex(item => String(item.id) === String(editId));
          if (index !== -1) {
            queue[index].isim = val;
            queue[index].ulke = countrySelect.value;
            queue[index].banko = counterInput.value;
          }
          document.getElementById('editId').value = '';
          document.getElementById('saveBtn').textContent = 'Listeye Ekle';
          document.getElementById('saveBtn').style.background = '#22c55e';
          document.getElementById('cancelEditBtn').style.display = 'none';
        } else {
          queue.push({
            id: String(Date.now() + Math.random()),
            isim: val,
            ulke: countrySelect.value,
            banko: counterInput.value,
            status: 'Bekliyor',
            calledAt: 0
          });
        }

        nameInput.value = '';
        saveData();
      });

      // Düzenleme İptal
      document.getElementById('cancelEditBtn').addEventListener('click', () => {
        document.getElementById('editId').value = '';
        document.getElementById('personName').value = '';
        document.getElementById('saveBtn').textContent = 'Listeye Ekle';
        document.getElementById('saveBtn').style.background = '#22c55e';
        document.getElementById('cancelEditBtn').style.display = 'none';
      });

      // Seçilenleri Çağır
      document.getElementById('btnCallSelected').addEventListener('click', () => {
        const checkboxes = document.querySelectorAll('.mini-checkbox:checked');
        if (checkboxes.length === 0) return alert("Lütfen listeden en az bir kişi seçin!");

        let updated = false;
        let timestamp = Date.now();

        checkboxes.forEach((cb, index) => {
          const id = cb.getAttribute('data-id');
          const item = queue.find(i => String(i.id) === String(id));
          if (item && item.status !== 'Çağrıldı') {
            item.status = 'Çağrıldı';
            item.calledAt = timestamp + index;
            updated = true;
          }
        });

        if (updated) {
          dingSound.currentTime = 0;
          dingSound.play().catch(e => console.log("Ses engellendi"));
          saveData(true);
        }
      });

      // Dinamik Silme / Düzenleme Butonları
      document.getElementById('miniList').addEventListener('click', (e) => {
        const editId = e.target.getAttribute('data-edit-id');
        const deleteId = e.target.getAttribute('data-delete-id');

        if (editId) {
          const item = queue.find(i => String(i.id) === String(editId));
          if (!item) return;
          document.getElementById('editId').value = item.id;
          document.getElementById('personName').value = item.isim;
          document.getElementById('countrySelect').value = item.ulke || 'TR';
          document.getElementById('counterName').value = item.banko || 'Banko 1';

          document.getElementById('saveBtn').textContent = 'Güncellemeyi Kaydet';
          document.getElementById('saveBtn').style.background = '#f59e0b';
          document.getElementById('cancelEditBtn').style.display = 'block';
        }

        if (deleteId) {
          queue = queue.filter(item => String(item.id) !== String(deleteId));
          saveData();
        }
      });

      // Excel Dosya Yükleme
      document.getElementById('excelFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
          try {
            if (typeof XLSX === 'undefined') return alert("Excel kütüphanesi yüklenemedi.");
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);

            let addedCount = 0;
            jsonData.forEach(row => {
              const isim = row.İsim || row.Ad || row.Name || row[Object.keys(row)[0]];
              const ulke = row.Ülke || row.Ulke || row.Country || "TR";

              if (isim) {
                queue.push({
                  id: String(Date.now() + Math.random()),
                  isim: String(isim).trim(),
                  ulke: String(ulke).trim().toUpperCase(),
                  banko: "Banko 1",
                  status: 'Bekliyor',
                  calledAt: 0
                });
                addedCount++;
              }
            });

            saveData();
            alert(`${addedCount} kişi başarıyla listeye eklendi!`);
          } catch (err) {
            alert("Excel okunurken hata oluştu.");
          }
          document.getElementById('excelFile').value = '';
        };
        reader.readAsArrayBuffer(file);
      });
    });

    // Sekmeler Arası Canlı Veri Dinleme
    window.addEventListener('storage', (e) => {
      if (e.key === 'siramatik_queue') {
        try {
          queue = JSON.parse(e.newValue) || [];
          renderUI();
        } catch(err) {}
      }
      if (e.key === 'siramatik_title') {
        renderTitle();
      }
      if (e.key === 'siramatik_play_sound' && isTVMode) {
        dingSound.currentTime = 0;
        dingSound.play().catch(e => console.log("Ses oynatma izni bekleniyor"));
      }
    });
  </script>
</body>
</html>
